<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0a0a12" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#cyber-grad)" stroke-width="1.5" opacity="0.6" />
  <polygon points="32,14 50,32 32,50 14,32" fill="none" stroke="url(#cyber-grad)" stroke-width="3.5" stroke-linejoin="round" filter="url(#glow)" />
  <circle cx="32" cy="32" r="4" fill="#00f3ff" filter="url(#glow)" />
</svg>
