{% load static %}
<footer style="position:relative;z-index:1;border-top:1px solid var(--border-subtle);padding:3rem 0 2rem;">
  <div class="container">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:1.5rem;margin-bottom:2rem;">
      <div>
        <div style="font-family:var(--font-mono);font-size:1.4rem;font-weight:700;color:#fff;margin-bottom:0.5rem;">{{ site.logo_text|default:"NG." }}</div>
        <p style="color:var(--text-secondary);font-size:0.875rem;max-width:400px;">{{ site.tagline }}</p>
      </div>
      <div style="display:flex;gap:1rem;">
        {% if github_url %}
        <a href="{{ github_url }}" target="_blank" rel="noopener noreferrer" class="btn btn-ghost" aria-label="GitHub profile" style="padding:0.5rem 1rem;">GitHub</a>
        {% endif %}
        {% if linkedin_url %}
        <a href="{{ linkedin_url }}" target="_blank" rel="noopener noreferrer" class="btn btn-ghost" aria-label="LinkedIn profile" style="padding:0.5rem 1rem;">LinkedIn</a>
        {% endif %}
        {% if contact_email %}
        <a href="mailto:{{ contact_email }}" class="btn btn-ghost" aria-label="Send email" style="padding:0.5rem 1rem;">Email</a>
        {% endif %}
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:1rem;padding-top:1.5rem;border-top:1px solid var(--border-subtle);">
      <p style="color:var(--text-muted);font-family:var(--font-mono);font-size:0.7rem;letter-spacing:0.08em;">
        © 2025 NAGASRINIVAS GOVVALA · HYDERABAD, TELANGANA
      </p>
    </div>
  </div>
</footer>
