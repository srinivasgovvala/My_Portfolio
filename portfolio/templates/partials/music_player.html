<!-- Music Player (floating) -->
<div id="music-player" class="music-player" aria-label="Ambient music player" hidden>
  <div class="music-player-inner">
    <div class="music-info">
      <span class="music-now-playing" id="musicTrackName">No track</span>
    </div>
    <div class="music-controls">
      <button id="musicPrevBtn" class="music-btn" aria-label="Previous track">‹</button>
      <button id="musicPlayBtn" class="music-btn music-btn-main" aria-label="Play / Pause">▶</button>
      <button id="musicNextBtn" class="music-btn" aria-label="Next track">›</button>
    </div>
    <input type="range" id="musicVolume" class="music-volume" min="0" max="1" step="0.05" value="0.4" aria-label="Volume">
  </div>
</div>
